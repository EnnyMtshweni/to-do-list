<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TASKS — Do The Thing</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="wrapper">
    <header>
      <p class="header-label">// task manager v1.0</p>
      <h1>DO THE<br><span>THING.</span></h1>
      <div class="stats-row">
        <div class="stat"><strong id="stat-active">0</strong> active</div>
        <div class="stat"><strong id="stat-done">0</strong> done</div>
        <div class="stat"><strong id="stat-total">0</strong> total</div>
      </div>
    </header>
    
    <div class="input-row">
      <input type="text" id="task-input" placeholder="add a new task and hit enter..." maxlength="200" autocomplete="off" />
      <!-- Tefo Komane: Adding a Priority dropdown for the Priority feature -->
      <select id="priority-select">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <button id="add-btn">ADD</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>
    <div class="empty-state" id="empty-state">
      <div class="icon">○</div>
      <p>nothing here yet</p>
    </div>

    <div class="list-footer">
      <button id="clear-completed">clear completed</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
